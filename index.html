<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIKS Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var storageKey = 'viks-theme';
          var stored = localStorage.getItem(storageKey);
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cases">
    <div class="loader" aria-hidden="true">
      <div class="loader__inner">
        <div class="logo logo--loader">
          <img
            class="logo__image"
            data-logo-image
            src=""
            alt="VIKS Production"
          />
          <span class="sr-only">VIKS Production</span>
        </div>
        <div class="loader__spinner"></div>
      </div>
    </div>

    <header class="site-header" role="banner">
      <div class="site-header__inner">
        <div class="logo">
          <img
            class="logo__image"
            data-logo-image
            src=""
            alt="VIKS Production"
          />
          <span class="sr-only">VIKS Production</span>
        </div>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          data-theme-toggle-state="dark"
          aria-pressed="true"
          aria-label="Toggle light and dark mode"
        >
          <span class="theme-toggle__icon" aria-hidden="true">
            <span class="theme-toggle__thumb"></span>
          </span>
          <span class="theme-toggle__label" data-theme-toggle-label>Dark mode</span>
        </button>
      </div>
    </header>

    <main id="main" class="site-main" role="main">
      <section id="portfolio" class="portfolio" aria-label="Featured work">
        <div class="portfolio__grid" data-portfolio-grid></div>
        <noscript>
          <p class="portfolio__noscript">Enable JavaScript to view the full portfolio grid.</p>
        </noscript>
      </section>

      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__links">
          <li>
            <a href="./index.html" class="site-nav__link" data-nav-page="home">
              Home
            </a>
          </li>
          <li>
            <a href="./about.html" class="site-nav__link" data-nav-page="about">
              About
            </a>
          </li>
          <li>
            <a
              href="#portfolio"
              class="site-nav__link site-nav__link--active"
              data-nav-page="cases"
              aria-current="page"
            >
              Cases
            </a>
          </li>
          <li>
            <a href="./contact.html" class="site-nav__link" data-nav-page="contact">
              Contact
            </a>
          </li>
        </ul>
      </nav>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="site-footer__cta">
        <p class="site-footer__headline">Get more in your inbox</p>
        <form class="site-footer__form">
          <label for="email" class="sr-only">Email</label>
          <input id="email" type="email" placeholder="Subscribe" required />
          <button type="submit">→</button>
        </form>
      </div>
      <div class="site-footer__theme">
        <p class="site-footer__theme-label">Theme</p>
        <button
          type="button"
          class="theme-toggle theme-toggle--compact"
          data-theme-toggle
          data-theme-toggle-state="dark"
          aria-pressed="true"
          aria-label="Toggle light and dark mode"
        >
          <span class="theme-toggle__icon" aria-hidden="true">
            <span class="theme-toggle__thumb"></span>
          </span>
          <span class="theme-toggle__label" data-theme-toggle-label>Dark mode</span>
        </button>
      </div>
      <div class="site-footer__meta">
        <p>© <span id="year"></span> VIKS Production. All rights reserved.</p>
        <p>Part of the VIKS Studio Network.</p>
      </div>
      <div class="site-footer__links">
        <a href="https://www.instagram.com/viks_production/" target="_blank" rel="noreferrer">Instagram</a>
        <a href="#">TikTok</a>
        <a href="#">Behance</a>
      </div>
    </footer>

    <div class="player" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="player__inner">
        <button class="player__close" aria-label="Close video">×</button>
        <div class="player__stage">
          <div class="player__embed" data-player-embed></div>
          <div class="player__hud">
            <div class="player__labels">
              <p class="player__label player__label--client" data-player-client></p>
              <p class="player__label player__label--title" data-player-title></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="player__overlay" hidden></div>

    <script src="logo-config.js"></script>
    <script src="contact-config.js"></script>
    <script src="portfolio-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
